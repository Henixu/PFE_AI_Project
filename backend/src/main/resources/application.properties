spring.application.name=soprahr-interne
server.port=${SERVER_PORT:8080}

# Variables locales optionnelles (backend/.env, non versionné - voir .env.example)
spring.config.import=optional:file:.env[.properties]

# ===== PostgreSQL =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/soprahr_interne}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de connexions (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000

# ===== JPA / Hibernate =====
# Le schéma est géré par Flyway (db/migration) ; Hibernate se contente de le valider
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
# Secret Base64 (32 octets minimum) : obligatoire, aucune valeur par défaut. Voir .env.example
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=soprahr-interne
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== CORS =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ===== Réinitialisation du mot de passe =====
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}
app.password-reset.frontend-url=${FRONTEND_URL:http://localhost:4200}

# ===== Administrateur initial (optionnel, voir .env.example) =====
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
