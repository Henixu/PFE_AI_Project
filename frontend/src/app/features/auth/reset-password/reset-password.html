<main class="auth-card">
  <h1>Nouveau mot de passe</h1>
  @if (done()) {
    <p>Mot de passe mis à jour. <a routerLink="/login">Se connecter</a></p>
  } @else if (!token) {
    <p class="error" role="alert">Lien invalide. <a routerLink="/forgot-password">Refaire une demande</a></p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label>Nouveau mot de passe (8 à 72 caractères)
        <input type="password" formControlName="password" autocomplete="new-password" />
      </label>
      <label>Confirmation
        <input type="password" formControlName="confirm" autocomplete="new-password" />
      </label>
      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }
      <button type="submit" [disabled]="loading()">Enregistrer</button>
    </form>
  }
</main>
