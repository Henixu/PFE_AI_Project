<div
  [attr.role]="type() === 'error' ? 'alert' : 'status'"
  class="flex items-start gap-3 rounded-md border px-4 py-3 text-sm animate-fade-in"
  [class]="styles().box"
>
  <app-icon [name]="styles().icon" class="mt-px h-5 w-5" />
  <div class="min-w-0">
    @if (title()) {
      <p class="font-semibold">{{ title() }}</p>
    }
    <div [class.mt-0.5]="!!title()"><ng-content /></div>
  </div>
</div>
