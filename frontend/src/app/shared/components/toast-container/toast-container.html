<div
  class="pointer-events-none fixed inset-x-4 top-4 z-50 flex flex-col items-end gap-3 sm:inset-x-auto sm:right-4 sm:w-96"
  aria-live="polite"
>
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      animate.enter="toast-enter"
      animate.leave="toast-leave"
      [attr.role]="toast.type === 'error' ? 'alert' : 'status'"
      class="pointer-events-auto relative w-full overflow-hidden rounded-2xl border bg-white/90 shadow-2xl backdrop-blur-xl dark:bg-slate-900/90"
      [class]="styles[toast.type].card"
    >
      <div class="flex items-start gap-3 p-4">
        <!-- Icône -->
        <div
          class="grid h-9 w-9 shrink-0 place-items-center rounded-xl"
          [class]="styles[toast.type].icon"
        >
          <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
            @switch (toast.type) {
              @case ('success') {
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
              }
              @case ('error') {
                <path stroke-linecap="round" stroke-linejoin="round" d="m9.75 9.75 4.5 4.5m0-4.5-4.5 4.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
              }
              @case ('warning') {
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
              }
              @default {
                <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
              }
            }
          </svg>
        </div>

        <div class="min-w-0 flex-1 pt-0.5">
          <p class="text-sm font-semibold text-slate-900 dark:text-white">{{ toast.title }}</p>
          @if (toast.message) {
            <p class="mt-0.5 text-sm text-slate-600 dark:text-slate-400">{{ toast.message }}</p>
          }
        </div>

        <button
          type="button"
          (click)="toastService.dismiss(toast.id)"
          class="-m-1 rounded-lg p-1 text-slate-400 transition hover:bg-slate-100 hover:text-slate-700 dark:hover:bg-white/10 dark:hover:text-white"
          aria-label="Fermer la notification"
        >
          <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Barre de progression (durée restante) -->
      @if (toast.duration > 0) {
        <div
          class="absolute inset-x-0 bottom-0 h-1 origin-left animate-shrink"
          [style.animation-duration.ms]="toast.duration"
          [class]="styles[toast.type].bar"
        ></div>
      }
    </div>
  }
</div>
