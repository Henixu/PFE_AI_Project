<div
  class="pointer-events-none fixed inset-x-4 top-4 z-[60] flex flex-col items-end gap-2 sm:inset-x-auto sm:right-4 sm:w-96"
  aria-live="polite"
>
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      animate.enter="toast-enter"
      animate.leave="toast-leave"
      [attr.role]="toast.type === 'error' ? 'alert' : 'status'"
      class="pointer-events-auto relative w-full overflow-hidden rounded-lg border border-slate-200 bg-white shadow-lg dark:border-slate-700 dark:bg-slate-900"
    >
      <div class="flex items-start gap-3 p-4">
        <app-icon [name]="styles[toast.type].icon" class="h-5 w-5" [class]="styles[toast.type].color" />

        <div class="min-w-0 flex-1">
          <p class="text-sm font-medium text-slate-900 dark:text-white">{{ toast.title }}</p>
          @if (toast.message) {
            <p class="mt-0.5 text-sm text-slate-500 dark:text-slate-400">{{ toast.message }}</p>
          }
        </div>

        <button
          type="button"
          (click)="toastService.dismiss(toast.id)"
          class="-m-1 rounded-md p-1 text-slate-400 transition hover:bg-slate-100 hover:text-slate-700 dark:hover:bg-slate-800 dark:hover:text-white"
          aria-label="Fermer la notification"
        >
          <app-icon name="x" class="h-4 w-4" />
        </button>
      </div>

      <!-- Barre de progression (durée restante) -->
      @if (toast.duration > 0) {
        <div
          class="absolute inset-x-0 bottom-0 h-0.5 origin-left animate-shrink opacity-60"
          [style.animation-duration.ms]="toast.duration"
          [class]="styles[toast.type].bar"
        ></div>
      }
    </div>
  }
</div>
