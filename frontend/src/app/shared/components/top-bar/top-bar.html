<header
  class="sticky top-0 z-40 border-b border-slate-200/70 bg-white/70 backdrop-blur-xl dark:border-white/10 dark:bg-slate-950/70"
>
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
    <a routerLink="/dashboard" class="flex items-center gap-2.5">
      <div class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-brand-600 to-fuchsia-600 text-white shadow-lg shadow-brand-600/30">
        <span class="font-extrabold">S</span>
      </div>
      <span class="hidden font-bold tracking-tight sm:inline">SopraHR Interne</span>
    </a>

    <nav class="flex items-center gap-1" aria-label="Navigation principale">
      <a
        routerLink="/dashboard"
        routerLinkActive="!bg-brand-50 !text-brand-700 dark:!bg-brand-500/15 dark:!text-brand-300"
        class="btn-ghost"
      >
        Tableau de bord
      </a>
      @if (auth.hasAnyRole(['ADMIN'])) {
        <a
          routerLink="/admin"
          routerLinkActive="!bg-brand-50 !text-brand-700 dark:!bg-brand-500/15 dark:!text-brand-300"
          class="btn-ghost"
        >
          Administration
        </a>
      }
    </nav>

    <div class="flex items-center gap-2 sm:gap-3">
      <app-theme-toggle />

      <div class="hidden items-center gap-3 rounded-xl border border-slate-200 bg-white/60 py-1 pl-1 pr-3 dark:border-white/10 dark:bg-slate-800/60 md:flex">
        <div class="grid h-8 w-8 place-items-center rounded-lg bg-gradient-to-br from-brand-500 to-fuchsia-500 text-xs font-bold text-white">
          {{ initials() }}
        </div>
        <div class="leading-tight">
          <p class="max-w-36 truncate text-sm font-semibold">{{ displayName() }}</p>
          <p class="text-xs text-slate-500 dark:text-slate-400">{{ auth.user()?.role }}</p>
        </div>
      </div>

      <button type="button" (click)="logout()" class="btn-ghost !text-rose-600 hover:!bg-rose-50 dark:!text-rose-400 dark:hover:!bg-rose-500/10" title="Se déconnecter">
        <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
        </svg>
        <span class="hidden sm:inline">Déconnexion</span>
      </button>
    </div>
  </div>
</header>
