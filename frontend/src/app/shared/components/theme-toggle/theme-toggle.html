<button
  type="button"
  (click)="themeService.toggle()"
  [attr.aria-label]="themeService.theme() === 'dark' ? 'Activer le mode clair' : 'Activer le mode sombre'"
  [attr.title]="themeService.theme() === 'dark' ? 'Mode clair' : 'Mode sombre'"
  class="btn-icon h-9 w-9 border border-slate-200 dark:border-slate-700"
>
  <app-icon [name]="themeService.theme() === 'dark' ? 'sun' : 'moon'" class="h-[18px] w-[18px]" />
</button>
