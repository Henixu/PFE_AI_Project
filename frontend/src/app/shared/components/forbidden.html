<div class="relative flex min-h-screen items-center justify-center overflow-hidden px-4 py-12">
  <div class="pointer-events-none absolute -left-24 top-1/4 h-80 w-80 rounded-full bg-rose-400/20 blur-3xl animate-blob dark:bg-rose-600/15"></div>
  <div class="pointer-events-none absolute -right-24 bottom-1/4 h-80 w-80 rounded-full bg-brand-400/20 blur-3xl animate-blob [animation-delay:-6s] dark:bg-brand-600/15"></div>

  <div class="absolute right-4 top-4 sm:right-6 sm:top-6">
    <app-theme-toggle />
  </div>

  <main class="relative w-full max-w-lg text-center">
    <!-- Illustration -->
    <div class="relative mx-auto mb-8 h-40 w-40 animate-scale-in">
      <div class="absolute inset-0 rounded-full bg-gradient-to-br from-rose-500 to-orange-500 opacity-20 blur-2xl"></div>
      <div class="relative grid h-40 w-40 place-items-center rounded-full border border-rose-200 bg-white/80 shadow-2xl shadow-rose-500/20 backdrop-blur dark:border-rose-500/30 dark:bg-slate-900/80 animate-float">
        <svg class="h-20 w-20 text-rose-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
        </svg>
      </div>
    </div>

    <p
      class="bg-gradient-to-r from-rose-500 via-orange-500 to-rose-500 bg-[length:200%_100%] bg-clip-text text-7xl font-black tracking-tighter text-transparent animate-gradient sm:text-8xl"
    >
      403
    </p>
    <h1 class="mt-4 text-2xl font-bold tracking-tight text-slate-900 animate-fade-in-up [animation-delay:100ms] dark:text-white sm:text-3xl">
      Accès refusé
    </h1>
    <p class="mx-auto mt-3 max-w-md text-slate-500 animate-fade-in-up [animation-delay:200ms] dark:text-slate-400">
      Vous n'avez pas les droits nécessaires pour consulter cette page. Si vous pensez qu'il s'agit d'une erreur,
      contactez un administrateur.
    </p>

    <div class="mt-8 flex flex-col items-center justify-center gap-3 animate-fade-in-up [animation-delay:300ms] sm:flex-row">
      <a routerLink="/dashboard" class="btn-primary sm:w-auto sm:px-6">
        <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
        </svg>
        Retour à l'accueil
      </a>
      <button type="button" (click)="back()" class="btn-ghost">
        <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
        </svg>
        Page précédente
      </button>
    </div>
  </main>
</div>
