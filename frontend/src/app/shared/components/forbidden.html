<div class="relative flex min-h-screen items-center justify-center bg-slate-50 px-4 py-12 dark:bg-slate-950">
  <div class="absolute right-4 top-4 sm:right-6 sm:top-6">
    <app-theme-toggle />
  </div>

  <main class="w-full max-w-md text-center animate-fade-in-up">
    <span class="mx-auto grid h-14 w-14 place-items-center rounded-full bg-rose-50 text-rose-600 ring-8 ring-rose-50/50 dark:bg-rose-500/10 dark:text-rose-400 dark:ring-rose-500/5">
      <app-icon name="lock-closed" class="h-7 w-7" />
    </span>

    <p class="mt-6 text-sm font-semibold text-rose-600 dark:text-rose-400">Erreur 403</p>
    <h1 class="mt-2 text-2xl font-semibold tracking-tight text-slate-900 dark:text-white sm:text-3xl">Accès refusé</h1>
    <p class="mt-3 text-sm leading-relaxed text-slate-500 dark:text-slate-400">
      Vous n'avez pas les droits nécessaires pour consulter cette page. Si vous pensez qu'il s'agit d'une erreur,
      contactez un administrateur.
    </p>

    <div class="mt-8 flex flex-col-reverse items-center justify-center gap-3 sm:flex-row">
      <button type="button" (click)="back()" class="btn-secondary w-full sm:w-auto">
        <app-icon name="arrow-left" class="h-4 w-4" />
        Page précédente
      </button>
      <a routerLink="/dashboard" class="btn-primary sm:w-auto">
        <app-icon name="home" class="h-4 w-4" />
        Retour à l'accueil
      </a>
    </div>
  </main>
</div>
